[package]
categories = ["wasm", "development-tools::ffi"]
description = "Generate wasm-bindgen Rust bindings from TypeScript .d.ts files"
edition = "2021"
keywords = ["wasm", "wasm-bindgen", "typescript", "codegen", "ffi"]
license = "MIT OR Apache-2.0"
name = "ts-gen-wasm-bindgen"
repository = "https://github.com/wasm-bindgen/ts-gen"
version = "0.1.0"

[[bin]]
name = "ts-gen-wasm-bindgen"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indexmap = "2"
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "printing"] }
ts-gen = { workspace = true }
ts-gen-abi = { path = "../abi", version = "0.1.0" }

[dev-dependencies]
similar = "2"
