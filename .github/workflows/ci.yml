name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - uses: extractions/setup-just@v2
    - run: just fmt-check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: extractions/setup-just@v2
    - run: just clippy

  test:
    name: Test (unit + snapshot)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: extractions/setup-just@v2
    - run: just test

  test_integration:
    name: Test (wasm-bindgen integration${{ matrix.rustflags && ', unstable js-sys' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Generated bindings compile against both js-sys APIs; real-generic
        # element types (`Array<String>`) need the unstable one.
        rustflags: ['', '--cfg=js_sys_unstable_apis']
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - uses: extractions/setup-just@v2
    # `just test-integration` invokes the wasm-bindgen-test-runner that
    # ships with `wasm-bindgen-cli`. Install from the same revision as the
    # patched workspace dependencies so their binary schemas match.
    - run: >-
        cargo install wasm-bindgen-cli
        --git https://github.com/wasm-bindgen/wasm-bindgen
        --rev 67e24940f1865a02f25e07eb04267039023b9877
        --locked
    - run: just test-integration
      env:
        RUSTFLAGS: ${{ matrix.rustflags }}
