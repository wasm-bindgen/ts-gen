name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - uses: extractions/setup-just@v2
    - run: just fmt-check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: extractions/setup-just@v2
    - run: just clippy

  test:
    name: Test (unit + snapshot)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    # The bridge runtime tests need WasmGC, exnref, JS string builtins and
    # memory64, and require Node 26 under CI.
    - uses: actions/setup-node@v4
      with:
        node-version: '26'
    - uses: extractions/setup-just@v2
    # The Kotlin and Zena compiles run in their own jobs.
    - run: just test
      env:
        TSGEN_SKIP_KOTLIN: '1'
        TSGEN_SKIP_ZENA: '1'

  test_kotlin:
    name: Test (Kotlin generator)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-node@v4
      with:
        node-version: '26'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.0.0'
    - uses: extractions/setup-just@v2
    - run: just test-kotlin

  # Compiles the Zena bindings with the Zena fork that carries the `tw`
  # option on `@external`. Enabled by the ZENA_ENABLED repository variable;
  # ZENA_REPO and ZENA_REF pick the fork and branch.
  test_zena:
    name: Test (Zena generator)
    if: vars.ZENA_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      ZENA_REPO: ${{ vars.ZENA_REPO || 'guybedford/zena' }}
      ZENA_REF: ${{ vars.ZENA_REF || 'gbedford/templated-external' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: ${{ env.ZENA_REPO }}
        ref: ${{ env.ZENA_REF }}
        path: zena
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-node@v4
      with:
        node-version: '26'
    - uses: extractions/setup-just@v2
    # zena-cli is a Rust host that runs the CLI module, which the fork's
    # checked-in bootstrap compiles from source.
    - name: Build zena-cli and its module
      working-directory: zena
      run: |
        npm ci
        npm run build -w @zena-lang/zena-cli
        echo "ZENA=$PWD/target/release/zena-cli" >> "$GITHUB_ENV"
        echo "ZENA_REPO_ROOT=$PWD" >> "$GITHUB_ENV"
    - run: just test-zena

  test_integration:
    name: Test (wasm-bindgen integration${{ matrix.rustflags && ', unstable js-sys' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Generated bindings compile against both js-sys APIs; real-generic
        # element types (`Array<String>`) need the unstable one.
        rustflags: ['', '--cfg=js_sys_unstable_apis']
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - uses: extractions/setup-just@v2
    - run: just install-wasm-bindgen-cli
    - run: just test-integration
      env:
        RUSTFLAGS: ${{ matrix.rustflags }}
