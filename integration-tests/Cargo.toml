[package]
edition = "2021"
name = "ts-gen-integration-tests"
publish = false
version = "0.0.0"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[build-dependencies]
syn = { version = "2", features = ["full"] }
ts-gen = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
# Generated `async fn` imports live in this library crate (via build.rs) and
# expand to `wasm_bindgen_futures` paths, so it can't be a dev-dependency.
wasm-bindgen-futures = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(js_sys_unstable_apis)'] }
