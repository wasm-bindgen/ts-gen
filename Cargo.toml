[workspace]
members = [
    "integration-tests",
]
exclude = [
    "examples/cloudflare-worker",
]
resolver = "2"

[workspace.dependencies]
ts-gen = { path = "." }

# wasm-bindgen ecosystem — used by integration-tests.
# Companion crates version independently but in lockstep with wasm-bindgen:
# js-sys 0.3.105, futures 0.4.78, and test 0.3.78 all pair with 0.2.128.
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
wasm-bindgen-test = "0.3.78"

# Temporarily track wasm-bindgen/wasm-bindgen main, which includes #5385
# (explicit ABI bounds on experimental_generic_mono imports), #5384 (`slice =
# view | array | copy` import argument modes), #5383, #5381, #5376, #5377 and
# #5341, until these ship in a release. All four crates must come from the
# same source.
[patch.crates-io]
js-sys = { git = "https://github.com/wasm-bindgen/wasm-bindgen", rev = "6513d6b118f4aa934b3ef553bb2e3ce8280791f2" }
wasm-bindgen = { git = "https://github.com/wasm-bindgen/wasm-bindgen", rev = "6513d6b118f4aa934b3ef553bb2e3ce8280791f2" }
wasm-bindgen-futures = { git = "https://github.com/wasm-bindgen/wasm-bindgen", rev = "6513d6b118f4aa934b3ef553bb2e3ce8280791f2" }
wasm-bindgen-test = { git = "https://github.com/wasm-bindgen/wasm-bindgen", rev = "6513d6b118f4aa934b3ef553bb2e3ce8280791f2" }

[package]
categories = ["wasm", "development-tools::ffi"]
description = "Generate wasm-bindgen Rust bindings from TypeScript .d.ts files"
edition = "2021"
keywords = ["wasm", "wasm-bindgen", "typescript", "codegen", "ffi"]
license = "MIT OR Apache-2.0"
name = "ts-gen"
readme = "README.md"
repository = "https://github.com/wasm-bindgen/ts-gen"
version = "0.1.0"

[features]
cli = ["clap", "walkdir"]
default = ["cli"]

[[bin]]
name = "ts-gen"
path = "src/main.rs"
required-features = ["cli"]

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
convert_case = "0.6"
indexmap = "2"
oxc_allocator = "0.154"
oxc_ast = "0.154"
oxc_parser = "0.154"
oxc_resolver = "11"
oxc_span = "0.154"
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "printing"] }
walkdir = { version = "2", optional = true }

[dev-dependencies]
similar = "2"
