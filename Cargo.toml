[workspace]
members = [
    "abi",
    "bridge",
    "examples/zena-bindgen",
    "integration-tests",
]
exclude = [
    "examples/cloudflare-worker",
]
resolver = "2"

[workspace.dependencies]
ts-gen = { path = "." }

# wasm-bindgen ecosystem — used by integration-tests.
# Companion crates version independently but in lockstep with wasm-bindgen:
# js-sys 0.3.105, futures 0.4.78, and test 0.3.78 all pair with 0.2.128.
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
wasm-bindgen-test = "0.3.78"

# Temporarily pin a tag of wasm-bindgen's generic stack (#5471's element ABI
# for sequences, #5440, #5445 and #5390's real-generic js-sys element types)
# with the open js-sys and macro changes the mono bindings use (#5375, #5441,
# #5443, #5444, #5448, #5450, #5484), until these ship in a release. The tag
# survives rebases of the branches. All four crates must come from the same
# source.
[patch.crates-io]
js-sys = { git = "https://github.com/wasm-bindgen/wasm-bindgen", tag = "ts-gen/mono-cells-a164c17d" }
wasm-bindgen = { git = "https://github.com/wasm-bindgen/wasm-bindgen", tag = "ts-gen/mono-cells-a164c17d" }
wasm-bindgen-futures = { git = "https://github.com/wasm-bindgen/wasm-bindgen", tag = "ts-gen/mono-cells-a164c17d" }
wasm-bindgen-test = { git = "https://github.com/wasm-bindgen/wasm-bindgen", tag = "ts-gen/mono-cells-a164c17d" }

[package]
categories = ["wasm", "development-tools::ffi"]
description = "Generate wasm-bindgen Rust bindings from TypeScript .d.ts files"
edition = "2021"
keywords = ["wasm", "wasm-bindgen", "typescript", "codegen", "ffi"]
license = "MIT OR Apache-2.0"
name = "ts-gen"
readme = "README.md"
repository = "https://github.com/wasm-bindgen/ts-gen"
version = "0.1.0"

[features]
cli = ["clap", "walkdir"]
default = ["cli"]

[[bin]]
name = "ts-gen"
path = "src/main.rs"
required-features = ["cli"]

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
ts-gen-abi = { path = "abi" }
clap = { version = "4", features = ["derive"], optional = true }
convert_case = "0.6"
indexmap = "2"
oxc_allocator = "0.154"
oxc_ast = "0.154"
oxc_parser = "0.154"
oxc_resolver = "11"
oxc_span = "0.154"
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "printing"] }
walkdir = { version = "2", optional = true }

[dev-dependencies]
similar = "2"
wasmparser = "0.263"

[[test]]
name = "kotlin"
path = "examples/kotlin-bindgen/tests/kotlin.rs"
