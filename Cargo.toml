[workspace]
members = [
    "integration-tests",
]
exclude = [
    "examples/cloudflare-worker",
]
resolver = "2"

[workspace.dependencies]
ts-gen = { path = "." }

# wasm-bindgen ecosystem — used by integration-tests.
# Companion crates version independently but in lockstep with wasm-bindgen:
# js-sys 0.3.105, futures 0.4.78, and test 0.3.78 all pair with 0.2.128.
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
wasm-bindgen-test = "0.3.78"

# Temporarily track the wasm-bindgen/wasm-bindgen#5433 branch (generic
# sequences over the element ABI, stacked on #5390's real-generic js-sys
# element types and on main with #5428 and #5437) until these ship in a
# release. Cargo.lock pins the commit; `cargo update -p wasm-bindgen` moves
# it. All four crates must come from the same source.
[patch.crates-io]
js-sys = { git = "https://github.com/wasm-bindgen/wasm-bindgen", branch = "gbedford/mono-vec" }
wasm-bindgen = { git = "https://github.com/wasm-bindgen/wasm-bindgen", branch = "gbedford/mono-vec" }
wasm-bindgen-futures = { git = "https://github.com/wasm-bindgen/wasm-bindgen", branch = "gbedford/mono-vec" }
wasm-bindgen-test = { git = "https://github.com/wasm-bindgen/wasm-bindgen", branch = "gbedford/mono-vec" }

[package]
categories = ["wasm", "development-tools::ffi"]
description = "Generate wasm-bindgen Rust bindings from TypeScript .d.ts files"
edition = "2021"
keywords = ["wasm", "wasm-bindgen", "typescript", "codegen", "ffi"]
license = "MIT OR Apache-2.0"
name = "ts-gen"
readme = "README.md"
repository = "https://github.com/wasm-bindgen/ts-gen"
version = "0.1.0"

[features]
cli = ["clap", "walkdir"]
default = ["cli"]

[[bin]]
name = "ts-gen"
path = "src/main.rs"
required-features = ["cli"]

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
convert_case = "0.6"
indexmap = "2"
oxc_allocator = "0.154"
oxc_ast = "0.154"
oxc_parser = "0.154"
oxc_resolver = "11"
oxc_span = "0.154"
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "printing"] }
walkdir = { version = "2", optional = true }
wasm-encoder = { version = "0.262", features = ["wasmparser"] }
wasmparser = "0.262"
wat = "1.259"
tempfile = "3"

[dev-dependencies]
similar = "2"
