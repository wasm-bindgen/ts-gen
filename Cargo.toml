[workspace]
members = [
    "integration-tests",
]
exclude = [
    "examples/cloudflare-worker",
]
resolver = "2"

[workspace.dependencies]
ts-gen = { path = "." }

# wasm-bindgen ecosystem — used by integration-tests.
# Companion crates version independently but in lockstep with wasm-bindgen:
# js-sys 0.3.105, futures 0.4.78, and test 0.3.78 all pair with 0.2.128.
js-sys = "0.3.105"
web-sys = "0.3.105"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
wasm-bindgen-test = "0.3.78"

# Temporarily track wasm-bindgen/wasm-bindgen#5390 (real-generic js-sys
# element types under `js_sys_unstable_apis`), stacked on #5384 (`slice = view
# | array | copy` import argument modes, element-wise borrowed slices) on top
# of main, which includes #5383 (unbounded `PartialEq`/`Eq` on imported types),
# #5381, #5376, #5377 and #5341, until these ship in a release. All four crates
# must come from the same source.
[patch.crates-io]
js-sys = { git = "https://github.com/wasm-bindgen/wasm-bindgen", rev = "67e24940f1865a02f25e07eb04267039023b9877" }
wasm-bindgen = { git = "https://github.com/wasm-bindgen/wasm-bindgen", rev = "67e24940f1865a02f25e07eb04267039023b9877" }
wasm-bindgen-futures = { git = "https://github.com/wasm-bindgen/wasm-bindgen", rev = "67e24940f1865a02f25e07eb04267039023b9877" }
wasm-bindgen-test = { git = "https://github.com/wasm-bindgen/wasm-bindgen", rev = "67e24940f1865a02f25e07eb04267039023b9877" }
web-sys = { git = "https://github.com/wasm-bindgen/wasm-bindgen", rev = "67e24940f1865a02f25e07eb04267039023b9877" }

[package]
categories = ["wasm", "development-tools::ffi"]
description = "Generate wasm-bindgen Rust bindings from TypeScript .d.ts files"
edition = "2021"
keywords = ["wasm", "wasm-bindgen", "typescript", "codegen", "ffi"]
license = "MIT OR Apache-2.0"
name = "ts-gen"
readme = "README.md"
repository = "https://github.com/wasm-bindgen/ts-gen"
version = "0.1.0"

[features]
cli = ["clap", "walkdir"]
default = ["cli"]

[[bin]]
name = "ts-gen"
path = "src/main.rs"
required-features = ["cli"]

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
convert_case = "0.6"
indexmap = "2"
oxc_allocator = "0.154"
oxc_ast = "0.154"
oxc_parser = "0.154"
oxc_resolver = "11"
oxc_span = "0.154"
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "printing", "visit-mut"] }
walkdir = { version = "2", optional = true }
wasm-encoder = { version = "0.262", features = ["wasmparser"] }
wasmparser = "0.262"
wat = "1.259"
tempfile = "3"

[dev-dependencies]
similar = "2"
